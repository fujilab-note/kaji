<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="家事">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<title>家事</title>
<style>
  /* Notion風の落ち着いた配色をベースに、カバー・サマリー・進み具合のバーで情報を足す */
  :root {
    --text: #37352f; --sub: #787774; --faint: #a5a29d; --line: rgba(55,53,47,.08);
    --hover: rgba(55,53,47,.05); --bg: #ffffff; --card: #fbfbfa; --sheet: #ffffff; --input: #f7f7f5;
    --red-bg: #fdebec; --red: #d44c47; --orange-bg: #fbecdd; --orange: #d9730d;
    --gray-bg: #f1f1ef; --green-bg: #edf3ec; --green: #448361; --track: #efeeeb;
    --cover: linear-gradient(120deg, #e9efe6 0%, #f4efe4 55%, #f6e9e2 100%);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --text: #e6e5e3; --sub: #9b9a97; --faint: #7d7b78; --line: rgba(255,255,255,.08);
      --hover: rgba(255,255,255,.05); --bg: #191919; --card: #202020; --sheet: #252525; --input: #2c2c2c;
      --red-bg: rgba(212,76,71,.18); --red: #ff7369; --orange-bg: rgba(217,115,13,.2); --orange: #ffa344;
      --gray-bg: rgba(255,255,255,.07); --green-bg: rgba(68,131,97,.22); --green: #6fc08f; --track: #2e2e2e;
      --cover: linear-gradient(120deg, #24302a 0%, #2e2a22 55%, #33261f 100%);
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); -webkit-user-select: none; user-select: none;
    font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }

  /* カバーとアイコン（Notionのページ頭の形） */
  .cover { height: calc(96px + env(safe-area-inset-top)); background: var(--cover); }
  .page { max-width: 640px; margin: 0 auto; padding: 0 18px 110px; }
  .logo { width: 64px; height: 64px; margin-top: -32px; border-radius: 16px; background: var(--bg);
    box-shadow: 0 0 0 1px var(--line), 0 6px 18px rgba(15,15,15,.10); display: flex; align-items: center; justify-content: center; }
  .logo svg { width: 54px; height: 54px; }
  h1 { font-size: 30px; font-weight: 700; margin: 14px 0 2px; letter-spacing: -.01em; }
  .date-row { display: flex; align-items: center; gap: 8px; min-height: 44px; }
  .date { flex: 1; color: var(--sub); font-size: 14px; }
  .refresh { width: 44px; height: 44px; flex: none; display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: var(--sub); padding: 0;
    -webkit-appearance: none; appearance: none; transition: background .15s, color .15s; }
  .refresh:active { background: var(--hover); color: var(--text); }
  .refresh:disabled { opacity: .65; }
  .refresh svg { width: 20px; height: 20px; }
  .refresh.loading svg { animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* サマリー：期限内の割合の輪と、状態ごとの件数 */
  .summary { display: flex; align-items: center; gap: 16px; margin: 20px 0 6px; padding: 14px 16px;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
  .ring { position: relative; width: 64px; height: 64px; flex: none; }
  .ring svg { transform: rotate(-90deg); }
  .ring-num { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: 17px; font-weight: 700; line-height: 1; }
  .ring-num small { font-size: 10px; font-weight: 500; color: var(--sub); margin-top: 3px; }
  .ring-bar { transition: stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1); }
  .stats { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .stat { text-align: center; }
  .stat b { display: block; font-size: 20px; font-weight: 700; letter-spacing: -.02em; }
  .stat span { font-size: 11.5px; color: var(--sub); }
  .stat.late b { color: var(--red); } .stat.soon b { color: var(--orange); } .stat.ok b { color: var(--green); }

  .section { display: flex; align-items: center; gap: 6px; margin: 24px 0 4px; padding: 0 2px;
    font-size: 13px; font-weight: 600; color: var(--sub); letter-spacing: .02em; }
  .section svg { width: 14px; height: 14px; }
  .count { color: var(--faint); font-weight: 500; }
  .list { border-top: 1px solid var(--line); }
  .row { display: flex; align-items: center; gap: 12px; padding: 13px 4px 12px; border-bottom: 1px solid var(--line);
    -webkit-touch-callout: none; transition: background .15s, opacity .3s, transform .3s; animation: rise .35s both; }
  .row:active { background: var(--hover); }
  .row.busy { pointer-events: none; }
  .row.busy .body { opacity: .45; }
  @keyframes rise { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  /* チェック：押すと緑に塗られてチェックが描かれる */
  .check { flex: none; width: 24px; height: 24px; border-radius: 50%; border: 1.6px solid var(--faint); display: flex;
    align-items: center; justify-content: center; transition: background .2s, border-color .2s, transform .2s; }
  .check svg { width: 14px; height: 14px; stroke: #fff; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round;
    stroke-dasharray: 20; stroke-dashoffset: 20; transition: stroke-dashoffset .3s .1s; }
  .row.busy .check { background: var(--green); border-color: var(--green); transform: scale(1.08); }
  .row.busy .check svg { stroke-dashoffset: 0; }

  .body { flex: 1; min-width: 0; transition: opacity .3s; }
  .top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .name { font-size: 16px; line-height: 1.35; }
  .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 6px; font-size: 12.5px; color: var(--faint); }
  .tag { display: inline-block; padding: 1px 7px; border-radius: 4px; font-size: 12px; line-height: 1.6; white-space: nowrap; }
  .t-place { background: var(--gray-bg); color: var(--sub); }
  .t-late { background: var(--red-bg); color: var(--red); }
  .t-due { background: var(--orange-bg); color: var(--orange); }
  .t-ok { background: var(--green-bg); color: var(--green); }
  /* 周期のうちどれだけ経ったかの細いバー */
  .bar { height: 3px; border-radius: 3px; background: var(--track); margin-top: 9px; overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 3px; transition: width .8s cubic-bezier(.2,.8,.2,1); }

  /* 自由枠が空のとき：一覧の最後に薄く出す */
  .row.slot .body { opacity: .5; }
  .row.slot .check { border-style: dashed; }

  .empty { color: var(--faint); font-size: 14px; padding: 14px 4px; border-bottom: 1px solid var(--line); }
  .error { color: var(--red); font-size: 14px; padding: 12px 4px; }
  .skeleton { height: 58px; border-bottom: 1px solid var(--line); background: linear-gradient(90deg, transparent, var(--hover), transparent);
    background-size: 200% 100%; animation: shimmer 1.2s infinite; }
  @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
  .hint { color: var(--faint); font-size: 12px; text-align: center; margin-top: 28px; line-height: 1.8; }

  /* 下から出るシート（日付選択・合言葉） */
  .scrim { position: fixed; inset: 0; background: rgba(15,15,15,.35); opacity: 0; pointer-events: none; transition: opacity .2s; }
  .scrim.show { opacity: 1; pointer-events: auto; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; background: var(--sheet); border-radius: 16px 16px 0 0;
    padding: 10px 18px calc(18px + env(safe-area-inset-bottom)); transform: translateY(100%); transition: transform .25s cubic-bezier(.2,.8,.2,1); }
  .sheet.show { transform: none; }
  .grabber { width: 36px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 14px; }
  .sheet-title { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
  .sheet-sub { font-size: 13px; color: var(--sub); margin-bottom: 14px; }
  .sheet input, .keybox input { width: 100%; font-size: 17px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--input); color: var(--text); -webkit-appearance: none; appearance: none; min-height: 46px;
    -webkit-user-select: text; user-select: text; }
  .rename { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); }
  .btns { display: flex; gap: 10px; margin-top: 16px; }
  .btn { flex: 1; font-size: 16px; padding: 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--sheet); color: var(--text); }
  .btn.primary { background: #2383e2; border-color: #2383e2; color: #fff; font-weight: 600; }
  .undo-last { display: block; width: 100%; margin-top: 14px; padding: 10px; background: none; border: none; color: var(--red); font-size: 15px; }
  .keybox { display: none; margin-top: 18px; padding: 16px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; }

  /* 記録後のお知らせ */
  /* 1件ずつ別のバーにして、新しいものを上へ積む */
  .toasts { position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    width: calc(100% - 32px); max-width: 480px; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
  .toast { transform: translateY(20px); background: rgba(47,52,55,.96); color: #fff; border-radius: 12px;
    padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; font-size: 14.5px;
    box-shadow: 0 10px 30px rgba(0,0,0,.2); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    opacity: 0; pointer-events: none; transition: opacity .2s, transform .25s cubic-bezier(.2,.8,.2,1); }
  .toast.show { opacity: 1; transform: translateY(0); pointer-events: auto; }
  .toast button { background: none; border: none; color: #7cc4ff; font-size: 14.5px; font-weight: 600; padding: 4px 0 4px 12px; }
</style>
</head>
<body>
<div class="cover"></div>
<div class="page">
  <div class="logo">
    <!-- ホーム画面のアイコンと同じ図柄：周期の矢印とチェック -->
    <svg viewBox="0 0 512 512" aria-hidden="true">
      <g fill="none" stroke="currentColor" stroke-width="34" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 386 196 A 150 150 0 1 0 404 280"/><path d="M 404 150 L 392 204 L 338 192"/>
      </g>
      <path d="M 198 262 L 240 304 L 316 224" fill="none" stroke="#448361" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
  <h1>家事</h1>
  <div class="date-row">
    <div class="date" id="date">&nbsp;</div>
    <button class="refresh" id="refresh" type="button" aria-label="一覧を更新" title="一覧を更新">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M20 6v5h-5"/><path d="M18.5 15.5A7.5 7.5 0 1 1 19.8 9"/>
      </svg>
    </button>
  </div>

  <div class="summary" id="summary" style="display:none">
    <div class="ring">
      <svg width="64" height="64" viewBox="0 0 64 64">
        <circle cx="32" cy="32" r="27" fill="none" stroke="var(--track)" stroke-width="7"/>
        <circle class="ring-bar" id="ringBar" cx="32" cy="32" r="27" fill="none" stroke="var(--green)" stroke-width="7"
          stroke-linecap="round" stroke-dasharray="169.6" stroke-dashoffset="169.6"/>
      </svg>
      <div class="ring-num"><span id="ringPct">0%</span><small>期限内</small></div>
    </div>
    <div class="stats">
      <div class="stat late"><b id="nLate">0</b><span>期限切れ</span></div>
      <div class="stat soon"><b id="nSoon">0</b><span>7日以内</span></div>
      <div class="stat ok"><b id="nOk">0</b><span>余裕あり</span></div>
    </div>
  </div>

  <div class="keybox" id="keybox">
    <div class="sheet-title">合言葉を入れてください</div>
    <div class="sheet-sub">初回だけ必要です。Claudeが渡したものを貼り付けます</div>
    <input id="keyInput" autocomplete="off" autocapitalize="off" spellcheck="false">
    <div class="btns"><button class="btn primary" id="keyOk">保存</button></div>
  </div>

  <div class="section">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8" cy="8" r="6.2"/><path d="M8 4.6V8l2.2 1.4" stroke-linecap="round"/></svg>
    期限が来たもの <span class="count" id="dueCount"></span>
  </div>
  <div class="list" id="due"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>

  <div class="section">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 4.5h10M3 8h7M3 11.5h4"/></svg>
    次回が近い順 <span class="count" id="restCount"></span>
  </div>
  <div class="list" id="rest"></div>

  <div class="hint">タップ＝今日やった　長押し＝日付を選んで記録・前回の記録の取り消し・自由枠の名前<br>v13</div>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet">
  <div class="grabber"></div>
  <div class="sheet-title" id="sheetName"></div>
  <div id="sheetDone">
    <div class="sheet-sub">やった日を選んでください</div>
    <input type="date" id="sheetDate">
    <div class="btns"><button class="btn" id="sheetCancel">やめる</button><button class="btn primary" id="sheetOk">記録</button></div>
  </div>
  <!-- 自由枠だけ：名前を入れる・書き換える・空に戻す -->
  <div id="sheetFree">
    <div class="sheet-sub" id="sheetFreeSub"></div>
    <input id="sheetFreeName" autocomplete="off" placeholder="やることの名前" enterkeyhint="done">
    <div class="btns"><button class="btn" id="sheetFreeAlt"></button><button class="btn primary" id="sheetFreeOk"></button></div>
  </div>
  <button class="undo-last" id="sheetUndo"></button>
</div>
<div class="toasts" id="toasts"></div>

<script>
let data = null, pickItem = null, loadPromise = null;
const $ = id => document.getElementById(id);

// データはGoogle Apps Script経由でNotionから読み書きする
const API = 'https://script.google.com/macros/s/AKfycbx0hjnf9ByfIm3d4XVJGvjlYjtIqQCq9M0IzEtYrv6oO-crcH93ujxVuM3NbVPY_3g/exec';

// 合言葉は ?k= で渡されたら端末に保存する。ホーム画面のアプリはSafariと保存領域が別なので、無ければ入力欄を出す
// 入力欄で打ち直した合言葉は、アドレスの ?k= より優先する（アドレス側が間違っていても直せるように）
function getKey() {
  const q = new URLSearchParams(location.search).get('k');
  if (q && !localStorage.getItem('kaji_key_manual')) localStorage.setItem('kaji_key', q);
  return localStorage.getItem('kaji_key');
}

async function call(body) {
  const res = await fetch(API, { method: 'POST', body: JSON.stringify(Object.assign({ k: getKey() }, body)) });
  const json = await res.json();
  if (json.error) throw new Error(json.error);
  return json;
}

function askKey() { $('keybox').style.display = 'block'; $('due').innerHTML = ''; }

function load() {
  if (!getKey()) { askKey(); return Promise.resolve(); }
  if (loadPromise) return loadPromise;
  $('refresh').classList.add('loading');
  $('refresh').disabled = true;
  loadPromise = call({ action: 'items' })
    .then(render)
    .catch(e => e.message === '合言葉が違います' ? askKey() : showError(e))
    .finally(() => {
      loadPromise = null;
      $('refresh').classList.remove('loading');
      $('refresh').disabled = false;
    });
  return loadPromise;
}

$('refresh').onclick = load;

$('keyOk').onclick = () => {
  const v = $('keyInput').value.trim();
  if (!v) return;
  localStorage.setItem('kaji_key', v);
  localStorage.setItem('kaji_key_manual', '1');
  $('keybox').style.display = 'none';
  load();
};

// サーバーのnullは画面に届くとundefinedになるので == null で判定する
function status(i) {
  if (i.daysLeft == null) return '<span class="tag t-late">未記録</span>';
  if (i.daysLeft < 0) return '<span class="tag t-late">' + (-i.daysLeft) + '日遅れ</span>';
  if (i.daysLeft === 0) return '<span class="tag t-due">今日</span>';
  return '<span class="tag ' + (i.daysLeft <= 7 ? 't-due' : 't-ok') + '">あと' + i.daysLeft + '日</span>';
}

// 周期のうち経った割合（未記録・遅れは満タン）と、その色
function progress(i) {
  if (i.daysLeft == null || i.daysLeft <= 0) return { pct: 100, color: i.daysLeft === 0 ? 'var(--orange)' : 'var(--red)' };
  const pct = Math.max(4, Math.round((1 - i.daysLeft / i.cycle) * 100));
  return { pct: pct, color: i.daysLeft <= 7 ? 'var(--orange)' : 'var(--green)' };
}

const CHECK = '<svg viewBox="0 0 16 16"><path d="M3.5 8.5l3 3 6-6.5"/></svg>';

const md = s => Number(s.slice(5, 7)) + '/' + Number(s.slice(8));

function row(i, n) {
  const last = i.last ? '前回 ' + md(i.last) : '前回なし';
  const p = progress(i);
  return '<div class="row" data-id="' + i.id + '" style="animation-delay:' + (n * 35) + 'ms"><div class="check">' + CHECK + '</div>' +
    '<div class="body"><div class="top"><div class="name">' + esc(i.name) + '</div></div>' +
    '<div class="meta">' + status(i) + (i.free ? '<span class="tag t-place">自由枠</span><span>' + md(i.since) + 'に入れた・' + i.cycle + '日以内</span>' :
      (i.place ? '<span class="tag t-place">' + esc(i.place) + '</span>' : '') + '<span>' + last + '・' + i.cycle + '日ごと</span>') + '</div>' +
    '<div class="bar"><i style="width:0;background:' + p.color + '" data-w="' + p.pct + '"></i></div></div></div>';
}

// 名前の入っていない自由枠。期限もサマリーの件数も持たない
function slotRow(s, n) {
  return '<div class="row slot" data-id="' + s.id + '" style="animation-delay:' + (n * 35) + 'ms"><div class="check"></div>' +
    '<div class="body"><div class="top"><div class="name">自由枠（未設定）</div></div>' +
    '<div class="meta"><span>押すと名前を入れられます・入れた日から30日以内</span></div></div></div>';
}

function render(d) {
  data = d;
  const t = new Date(d.today + 'T00:00:00');
  $('date').textContent = (t.getMonth() + 1) + '月' + t.getDate() + '日（' + '日月火水木金土'[t.getDay()] + '）';
  const due = d.items
    .filter(i => i.daysLeft == null || i.daysLeft <= 0)
    .sort((a, b) => {
      if (a.daysLeft == null) return b.daysLeft == null ? 0 : -1;
      if (b.daysLeft == null) return 1;
      return a.daysLeft - b.daysLeft;
    });
  const rest = d.items.filter(i => i.daysLeft != null && i.daysLeft > 0);
  $('due').innerHTML = due.length ? due.map(row).join('') : '<div class="empty">すべて期限内です</div>';
  const slot = d.slot ? slotRow(d.slot, d.items.length) : '';
  $('rest').innerHTML = rest.length || slot ? rest.map((i, n) => row(i, n + due.length)).join('') + slot : '<div class="empty">なし</div>';
  $('dueCount').textContent = due.length;
  $('restCount').textContent = rest.length;

  // サマリー
  const soon = rest.filter(i => i.daysLeft <= 7).length;
  const total = d.items.length || 1;
  const pct = Math.round(rest.length / total * 100);
  $('nLate').textContent = due.length; $('nSoon').textContent = soon; $('nOk').textContent = rest.length - soon;
  $('ringPct').textContent = pct + '%';
  $('summary').style.display = 'flex';
  requestAnimationFrame(() => requestAnimationFrame(() => {
    $('ringBar').style.strokeDashoffset = 169.6 * (1 - pct / 100);
    document.querySelectorAll('.bar i').forEach(b => b.style.width = b.dataset.w + '%');
  }));
  document.querySelectorAll('.row').forEach(attach);
}

function attach(el) {
  let timer = null, long = false, moved = false;
  el.addEventListener('touchstart', () => { long = false; moved = false; timer = setTimeout(() => { long = true; openSheet(el.dataset.id); }, 550); }, { passive: true });
  el.addEventListener('touchmove', () => { moved = true; clearTimeout(timer); }, { passive: true });
  el.addEventListener('touchend', e => { clearTimeout(timer); if (!long && !moved) { e.preventDefault(); done(el.dataset.id, null); } });
  el.addEventListener('click', () => { if (!('ontouchstart' in window)) done(el.dataset.id, null); });
  el.addEventListener('contextmenu', e => e.preventDefault());
}

function done(id, date) {
  if (data.slot && data.slot.id === id) return openSheet(id); // 空の自由枠は記録せず、名前を入れる画面を出す
  const item0 = data.items.find(i => i.id === id);
  if (!date && item0 && item0.last === data.today) return openSheet(id); // 今日もう記録済みなら二重に足さず、取り消しを選べる画面を出す
  const el = document.querySelector('.row[data-id="' + id + '"]');
  if (!el || el.classList.contains('busy')) return; // 二重記録を防ぐ
  el.classList.add('busy');
  if (navigator.vibrate) navigator.vibrate(10);
  const item = data.items.find(i => i.id === id);
  call({ action: 'done', itemId: id, date: date }).then(r => {
    toast(item.name + ' を記録しました', { logId: r.logId, itemId: id });
    load();
  }).catch(e => { el.classList.remove('busy'); showError(e); });
}

// バーごとに取り消す記録と10秒の時計を持たせる（続けて記録しても前のバーから取り消せるように）
function toast(msg, undo) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = '<span></span>' + (undo ? '<button>取り消す</button>' : '');
  el.firstChild.textContent = msg;
  $('toasts').prepend(el);
  el.offsetWidth; // 一度描かせてから表示クラスを付け、下からせり上がる動きを出す
  el.classList.add('show');
  const timer = setTimeout(() => hideToast(el), 10000);
  if (undo) el.querySelector('button').onclick = () => {
    clearTimeout(timer);
    hideToast(el);
    call({ action: 'undo', logId: undo.logId, itemId: undo.itemId })
      .then(() => { toast('取り消しました'); load(); }).catch(showError);
  };
}
function hideToast(el) {
  el.classList.remove('show');
  setTimeout(() => el.remove(), 250);
}

function openSheet(id) {
  const empty = !!(data.slot && data.slot.id === id);
  pickItem = empty ? Object.assign({ name: '自由枠' }, data.slot) : data.items.find(i => i.id === id);
  $('sheetName').textContent = pickItem.name;
  $('sheetDate').value = data.today;
  $('sheetDate').max = data.today;
  // 自由枠：空なら名前を入れるだけ、名前が入っていれば記録の下に書き換え・空に戻すを出す
  $('sheetDone').style.display = empty ? 'none' : '';
  $('sheetFree').style.display = empty || pickItem.free ? '' : 'none';
  $('sheetFree').className = empty ? '' : 'rename';
  $('sheetFreeSub').textContent = empty ? 'やることの名前を入れてください（今日から30日以内）' : '名前を書き換える（期限はそのまま）';
  $('sheetFreeName').value = empty ? '' : pickItem.name;
  $('sheetFreeAlt').textContent = empty ? 'やめる' : '空に戻す';
  $('sheetFreeOk').textContent = empty ? '入れる' : '書き換える';
  const l = pickItem.last;
  $('sheetUndo').textContent = l ? '前回の記録（' + (empty ? pickItem.lastName + '・' : '') + md(l) + '）を取り消す' : '';
  $('sheetUndo').style.display = l ? '' : 'none';
  $('scrim').classList.add('show');
  $('sheet').classList.add('show');
}
function closeSheet() { $('scrim').classList.remove('show'); $('sheet').classList.remove('show'); }
$('scrim').onclick = closeSheet;
$('sheetCancel').onclick = closeSheet;
$('sheetOk').onclick = () => { closeSheet(); done(pickItem.id, $('sheetDate').value); };
$('sheetFreeOk').onclick = () => {
  const name = $('sheetFreeName').value.trim();
  if (!name) return $('sheetFreeName').focus();
  const item = pickItem;
  closeSheet();
  call({ action: 'setName', itemId: item.id, name: name })
    .then(() => { toast('自由枠に「' + name + '」を入れました'); load(); }).catch(showError);
};
$('sheetFreeAlt').onclick = () => {
  const item = pickItem;
  closeSheet();
  if (!item.free) return; // 空の枠では「やめる」
  call({ action: 'clearName', itemId: item.id })
    .then(() => { toast('自由枠を空に戻しました'); load(); }).catch(showError);
};
// トーストを見逃しても、あとから最新の記録を1件ずつ取り消せる
$('sheetUndo').onclick = () => {
  const item = pickItem;
  closeSheet();
  call({ action: 'undoLast', itemId: item.id })
    .then(() => { toast((item.lastName || item.name) + ' の記録を取り消しました'); load(); }).catch(showError);
};

// 失敗は画面に残す（トーストだけだと消えて原因が分からない）
function showError(e) { $('due').innerHTML = '<div class="error">エラー：' + esc(e.message || String(e)) + '</div>'; }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]); }

// アプリに戻ってきたら最新にする（日付が変わっても古い表示のままにしない）
document.addEventListener('visibilitychange', () => { if (!document.hidden && data) load(); });

load();
</script>
